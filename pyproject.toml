[project]
name = "aria-guard"
version = "1.0.0"
description = "Real-time collision alerts for blind and low-vision pedestrians on Meta Project Aria glasses"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Roberto Rojo" }]

dependencies = [
    # Core
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",

    # ML/Vision — PyTorch installed from CUDA index
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "ultralytics>=8.3.0",
    "transformers>=4.35.0",

    # Web dashboard
    "flask>=3.0.0",

    # Audio
    "sounddevice>=0.4.6",
    "pyttsx3>=2.90",

    # Aria glasses
    "projectaria-client-sdk>=2.2.0",

    # TTS
    "nemo_toolkit[tts]>=2.2.0",

    # TensorRT inference
    "tensorrt>=10.0.0",

    # pyarrow compatible con NeMo
    "pyarrow==17.0.0",

    # ffmpeg para NeMo/pydub
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
# CUDA/GPU acceleration
cuda = [
    "nemo_toolkit[tts]>=2.2.0",
]
# Aria glasses support
aria = [
    "projectaria-client-sdk>=2.2.0",
]
# RealSense D435
realsense = [
    "pyrealsense2>=2.50.0",
]
# Development
dev = [
    "pytest>=8.0",
    "PyTurboJPEG>=1.7.0",
]

[tool.uv]
# Only resolve for Linux (project is Linux-only)
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
